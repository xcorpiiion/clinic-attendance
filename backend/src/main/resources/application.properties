spring.application.name=clinic-attendance
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinic}
spring.datasource.username=${DB_USERNAME:clinic}
spring.datasource.password=${DB_PASSWORD:clinic}

# O schema e das migracoes; o Hibernate so confere se a entidade bate com ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# O banco criado pelo database/init.sql ja tem a tabela da V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true

clinic.protocol.url=${PROTOCOL_URL:https://httpbin.org/uuid}
clinic.protocol.connect-timeout=2s
clinic.protocol.read-timeout=5s

clinic.processing.enabled=true
clinic.processing.poll-interval=2s
clinic.processing.max-concurrency=20
clinic.processing.max-attempts=5
clinic.processing.initial-backoff=5s
clinic.processing.max-backoff=2m
clinic.processing.stale-after=2m
clinic.processing.stale-check-interval=30s

clinic.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health
