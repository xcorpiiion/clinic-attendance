# Sobe a aplicação inteira: docker compose up --build
# Front em http://localhost:3000, API em http://localhost:8080 (Swagger em /swagger-ui.html).
#
# As portas do host podem ser trocadas no .env (FRONTEND_PORT, BACKEND_PORT, MYSQL_PORT),
# e PROTOCOL_URL aponta o serviço externo para simular falhas, por exemplo
# PROTOCOL_URL=https://httpbin.org/status/500

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clinic
      MYSQL_USER: clinic
      MYSQL_PASSWORD: clinic
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # O mesmo script entregue com o desafio; o Flyway parte dele.
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uclinic", "-pclinic"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/clinic
      DB_USERNAME: clinic
      DB_PASSWORD: clinic
      PROTOCOL_URL: ${PROTOCOL_URL:-https://httpbin.org/uuid}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
